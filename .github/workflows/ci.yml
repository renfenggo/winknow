name: Winknow V7.0 CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WinknowV7.sln

      - name: Build (Release)
        run: dotnet build WinknowV7.sln --configuration Release --no-restore --nologo

      - name: Test (Release)
        run: dotnet test WinknowV7.sln --configuration Release --no-build --nologo
