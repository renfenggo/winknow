name: Winknow V7.0 CI

on:
  push:
    branches: [main, develop, "feature/**", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WinknowV7.sln

      - name: Build (Release)
        run: dotnet build WinknowV7.sln --configuration Release --no-restore --nologo

      - name: Classroom selection and local-control scope smoke
        run: dotnet run --project tools/Winknow.ClassroomUiSmoke/Winknow.ClassroomUiSmoke.csproj --configuration Release

      - name: Test (Release)
        # CI 首跑修正（2026-10-08）：本地 Release 741/741 全绿但 CI 失败且日志需登录才能看。
        # 失败的测试名以 ::error:: workflow command 输出——转为 check annotation 后可经
        # 公开 API 读取，无需认证即可定位失败用例（annotations 上限 10 条，截断 200 字符）。
        shell: pwsh
        run: |
          dotnet test WinknowV7.sln --configuration Release --no-build --nologo 2>&1 |
            ForEach-Object { "$_" } | Tee-Object -FilePath test-output.log
          $code = $LASTEXITCODE
          $failed = Select-String -Path test-output.log -Pattern '(^\s*(失败|Failed)\s+\S+)|(\[FAIL\])' -Context 0,8 |
            Select-Object -First 6
          foreach ($f in $failed) {
            $m = ($f.Line.Trim() + ' || ' + (($f.Context.PostContext | ForEach-Object { $_.Trim() }) -join ' / '))
            if ($m.Length -gt 400) { $m = $m.Substring(0, 400) }
            Write-Host "::error::$m"
          }
          if ($code -ne 0 -and $failed.Count -eq 0) {
            Write-Host "::error::dotnet test exit $code without parsed test names - inspect raw log"
          }
          exit $code
